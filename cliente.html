<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu painel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
  :root{
    --accent: #3B5BDB; --accent-soft: #EEF1FE;
    --bg: #F6F7FB; --surface: #FFFFFF; --border: #E5E7EE;
    --text: #14161F; --text-muted: #6B7280; --text-faint: #9CA3AF;
    --success: #12B76A; --success-soft: #ECFDF3;
    --danger: #F04438; --danger-soft: #FEF3F2;
    --font-display: 'Plus Jakarta Sans', sans-serif; --font-body: 'Inter', sans-serif; --font-mono: 'JetBrains Mono', monospace;
    --radius: 14px; --shadow-sm: 0 1px 2px rgba(16,24,40,.06);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background: var(--bg); color: var(--text); font-family: var(--font-body); min-height:100vh; -webkit-font-smoothing:antialiased; }

  header{ background:var(--surface); border-bottom:1px solid var(--border); padding:20px 20px; }
  .brand{ display:flex; align-items:center; gap:10px; max-width:520px; margin:0 auto; }
  .brand .mark{ width:32px; height:32px; border-radius:9px; background:var(--accent); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .brand .mark svg{ width:16px; height:16px; }
  .brand .t{ font-family:var(--font-display); font-weight:700; font-size:15px; }
  .brand .s{ font-size:12px; color:var(--text-muted); }

  main{ max-width:520px; margin:0 auto; padding:24px 18px 60px; }

  .status-card{
    background: var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow-sm);
    padding:26px; margin-bottom:18px; text-align:center;
  }
  .status-card .valor{ font-family:var(--font-mono); font-size:30px; font-weight:700; }
  .status-card .valor.ok{ color: var(--success); }
  .status-card .valor.late{ color: var(--danger); }
  .status-card .label{ color:var(--text-muted); font-size:12px; text-transform:uppercase; letter-spacing:.06em; margin-top:6px; font-weight:600; }

  h2{ font-family:var(--font-display); font-size:12px; margin:26px 0 12px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.06em; font-weight:700; }

  .weeks{ display:flex; gap:6px; flex-wrap:wrap; }
  .week-chip{
    font-family: var(--font-mono); font-size:11px; padding:9px 12px; border-radius:9px;
    border:1.5px solid var(--border); background:var(--surface); color:var(--text-muted); font-weight:600;
  }
  .week-chip.pago{ background: var(--success-soft); color: var(--success); border-color:transparent; }
  .week-chip.atrasado{ background: var(--danger-soft); color: var(--danger); border-color:transparent; }

  .card{ background: var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:10px; box-shadow:var(--shadow-sm); }
  .desp-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .desp-desc{ font-weight:700; font-size:14px; }
  .desp-meta{ color:var(--text-muted); font-size:12px; margin-top:4px; }
  .desp-valor{ font-family:var(--font-mono); font-weight:700; font-size:14px; white-space:nowrap; }
  .tag{ font-size:11px; padding:3px 8px; border-radius:6px; background:#F0F1F5; color:var(--text-muted); display:inline-block; margin-top:7px; font-weight:600;}

  .empty{ text-align:center; padding:32px 20px; color:var(--text-faint); font-size:13px; }
  #not-found{ display:none; text-align:center; padding:100px 20px; }
  #not-found .big{ font-family:var(--font-display); font-size:17px; font-weight:700; }
  #not-found .small{ margin-top:8px; color:var(--text-muted); font-size:13px; }
</style>
</head>
<body>

<div id="not-found">
  <div class="big">Link inválido</div>
  <div class="small">Peça um novo link pra quem administra o painel.</div>
</div>

<div id="content" style="display:none;">
  <header>
    <div class="brand">
      <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M3 12l2-5.5A2 2 0 0 1 6.85 5h10.3a2 2 0 0 1 1.85 1.5L21 12M5 17h14M5 12h14M7 17v2M17 17v2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div><div class="t">Meu painel</div><div class="s" id="sub-carro"></div></div>
    </div>
  </header>
  <main>
    <div class="status-card">
      <div class="valor" id="status-valor">R$ 0</div>
      <div class="label" id="status-label">Situação</div>
    </div>

    <h2>Últimas semanas</h2>
    <div class="cell-sub" id="proximo-venc" style="color:var(--text-muted); font-size:12.5px; margin-bottom:10px;"></div>
    <div class="weeks" id="weeks-list"></div>

    <h2>Despesas divididas com você</h2>
    <div id="despesas-list"></div>
  </main>
</div>

<script src="firebase-config.js"></script>
<script>
function brl(v){ return 'R$ ' + (Number(v)||0).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function toLocalISO(d){
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function hojeISO(){ return toLocalISO(new Date()); }
function gerarVencimentos(diaVencimento, n=6){
  diaVencimento = Number(diaVencimento);
  if(isNaN(diaVencimento)) diaVencimento = 0;
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const diff = (hoje.getDay() - diaVencimento + 7) % 7;
  const maisRecente = new Date(hoje); maisRecente.setDate(hoje.getDate() - diff);
  const datas = [];
  for(let i=0; i<n; i++){ const d = new Date(maisRecente); d.setDate(maisRecente.getDate() - i*7); datas.push(toLocalISO(d)); }
  return datas.reverse();
}
function proximoVencimento(diaVencimento){
  diaVencimento = Number(diaVencimento);
  if(isNaN(diaVencimento)) diaVencimento = 0;
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const diff = (diaVencimento - hoje.getDay() + 7) % 7;
  const proximo = new Date(hoje); proximo.setDate(hoje.getDate() + diff);
  return toLocalISO(proximo);
}
function fmtSemana(iso){ const d = new Date(iso + 'T00:00:00'); return d.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'}); }
function categoriaLabel(c){ return { manutencao:'Manutenção', combustivel:'Combustível', documentacao:'Documentação', pneu:'Pneu', outro:'Outro' }[c] || c; }

const params = new URLSearchParams(location.search);
const locId = params.get('id');

if(!locId){
  document.getElementById('not-found').style.display = 'block';
} else {
  db.ref('locatarios/' + locId).on('value', snap => {
    const loc = snap.val();
    if(!loc){
      document.getElementById('not-found').style.display = 'block';
      document.getElementById('content').style.display = 'none';
      return;
    }
    document.getElementById('content').style.display = 'block';
    document.getElementById('sub-carro').textContent = `${loc.carro || ''} ${loc.placa ? '· '+loc.placa : ''}`;

    const pagamentos = loc.pagamentos || {};
    const hoje = hojeISO();
    const semanas = gerarVencimentos(loc.diaVencimento, 6);
    let emAberto = 0;
    semanas.forEach(s => {
      const pago = pagamentos[s] && pagamentos[s].pago;
      if(!pago && s < hoje) emAberto += Number(loc.valorSemanal)||0;
    });
    const valorEl = document.getElementById('status-valor');
    const labelEl = document.getElementById('status-label');
    if(emAberto > 0){
      valorEl.textContent = brl(emAberto); valorEl.className = 'valor late';
      labelEl.textContent = 'Em aberto';
    } else {
      valorEl.textContent = 'Em dia'; valorEl.className = 'valor ok';
      labelEl.textContent = `${brl(loc.valorSemanal)} por semana`;
    }

    document.getElementById('proximo-venc').textContent = `Próximo vencimento: ${fmtSemana(proximoVencimento(loc.diaVencimento))}`;
    document.getElementById('weeks-list').innerHTML = semanas.map(sem => {
      const pago = pagamentos[sem] && pagamentos[sem].pago;
      const atrasado = !pago && sem < hoje;
      const cls = pago ? 'pago' : (atrasado ? 'atrasado' : '');
      return `<div class="week-chip ${cls}">${fmtSemana(sem)}</div>`;
    }).join('');

    const desps = loc.despesas || {};
    const ids = Object.keys(desps).filter(id => desps[id].divisao === 'dividido' || desps[id].divisao === 'ele');
    ids.sort((a,b) => (desps[b].data||'').localeCompare(desps[a].data||''));
    const listEl = document.getElementById('despesas-list');
    if(ids.length === 0){
      listEl.innerHTML = `<div class="empty">Nenhuma despesa dividida até agora</div>`;
    } else {
      listEl.innerHTML = ids.map(id => {
        const d = desps[id];
        const suaParte = d.divisao === 'dividido' ? d.valor/2 : d.valor;
        const pagamentoLabel = d.formaPagamento === 'cartao' ? `Cartão · ${d.parcelas}x de ${brl(d.valorParcela)}` : 'Dinheiro/PIX';
        const dataFmt = d.data ? new Date(d.data+'T00:00:00').toLocaleDateString('pt-BR') : '';
        return `<div class="card">
          <div class="desp-row">
            <div>
              <div class="desp-desc">${d.descricao}</div>
              <div class="desp-meta">${dataFmt} · ${pagamentoLabel}</div>
              <div class="tag">${categoriaLabel(d.categoria)}</div>
            </div>
            <div class="desp-valor">${brl(suaParte)}</div>
          </div>
        </div>`;
      }).join('');
    }
  });
}
</script>
</body>
</html>
